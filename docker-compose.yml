version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prasan-it-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Use absolute path inside container for SQLite persistence
      DATABASE_URL: file:/app/data/dev.db
      # Required - the container refuses to start if these aren't set. Put real values in a .env file next to this compose file (never commit it).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file to a long random string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in your .env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env file}
      NODE_ENV: production
      # Optional - ticket notification emails are skipped if these aren't set
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    volumes:
      # Persist SQLite database across container restarts
      - sqlite-data:/app/data
    networks:
      - prasan-network

  # Optional: Caddy reverse proxy for HTTPS on Hetzner
  # Uncomment this section if you want automatic HTTPS with a domain
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: prasan-it-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   networks:
  #     - prasan-network
  #   depends_on:
  #     - app

volumes:
  sqlite-data:
    driver: local
  # caddy-data:
  # caddy-config:

networks:
  prasan-network:
    driver: bridge
